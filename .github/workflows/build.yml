name: Build ARMM Extension

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: pterodactyl
          MYSQL_PASSWORD: pterodactyl
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout extension
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_mysql, zip
          coverage: none

      - name: Prepare Pterodactyl test environment
        run: |
          git clone --depth 1 --branch v2.0.0-beta.2 https://github.com/pterodactyl/panel.git .ci/panel
          test "$(git -C .ci/panel rev-parse HEAD)" = ea742d332f5861a81e502857446b8df9cb9f0254
          cp .ci/panel/.env.example .ci/panel/.env
          sed -i \
            -e 's/^APP_ENV=.*/APP_ENV=testing/' \
            -e 's/^DB_DATABASE=.*/DB_DATABASE=testing/' \
            -e 's/^DB_USERNAME=.*/DB_USERNAME=pterodactyl/' \
            -e 's/^DB_PASSWORD=.*/DB_PASSWORD=pterodactyl/' \
            .ci/panel/.env
          composer --working-dir=.ci/panel install --no-interaction --prefer-dist --no-progress
          php .ci/panel/artisan key:generate --force

      - name: Run extension integration tests
        run: PANEL_DIR="$GITHUB_WORKSPACE/.ci/panel" ./scripts/test.sh

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Extension
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: armm-modsets
          path: |
            build/*.zip
            build/*.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: armm-modsets
          path: build

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/*.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            build/*.zip
            build/*.zip.sha256
          generate_release_notes: true
